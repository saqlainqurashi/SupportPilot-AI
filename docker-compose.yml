
services:
  db:
    image: postgres:16
    container_name: supportpilot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: supportpilot
      POSTGRES_USER: supportpilot_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
